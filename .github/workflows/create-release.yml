# Creates a draft release with the permission manifest attached.
#
# If the lock step, the manifest or the tag check fails, no draft exists. Fix the cause and dispatch the workflow again.
# If `gh release create` fails after it made the draft, delete the draft with `gh release delete <version> --yes`, then
# dispatch again. That's safe because a draft has no tag yet. A dispatch skips the lock step's commit when the versions
# are unchanged.
#
# The draft is created with --target at the commit the manifest came from. A fix that lands on main after the draft
# exists needs a new draft, so delete the draft and dispatch again.
#
# Before you publish the draft, check that:
#
# 1. the draft has both permission-manifest.json and permission-manifest-versions.json attached.
# 1. if the release changes module.kms[0].aws_kms_key.braintrust or aws_kms_alias.braintrust, or the set of protected
#    attributes, the release notes tell stacks with the KMS freeze on to run the off/on re-baseline, and why.
# 1. the release notes are correct.

name: Create Release

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: 'Terraform module release version (e.g., v1.2.3)'
        required: true
        type: string
      services_version:
        description: 'Lock onto Braintrust services version (e.g., v1.2.3). Optional.'
        required: false
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    # Read-only: the push and the release use the bot token, not github.token.
    # mise-action exports github.token as GITHUB_TOKEN to every later step,
    # including the one that runs downloaded Terraform and provider binaries.
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: bot-token
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          ref: main

      - name: Setup Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          # Keep the version the same in terraform-ci.yml.
          version: 2026.11.10
          install_args: "terraform uv"

      - name: Lock Braintrust service image versions
        if: inputs.services_version != ''
        run: |
          git config --global user.name "Braintrust Bot"
          git config --global user.email "braintrust-bot[bot]@users.noreply.github.com"
          ./lock_versions ${{ inputs.services_version }}
          git add .
          if git diff --cached --quiet; then
            echo "Braintrust service image versions are already at ${{ inputs.services_version }}; skipping commit."
            exit 0
          fi
          git commit -m "Update Braintrust Services versions to ${{ inputs.services_version }}"
          git push origin main

      - name: Drop the push credential
        # The manifest step runs downloaded Terraform and provider binaries, so the bot's push token mustn't be readable from .git/config.
        run: |
          # Exit code 5 means the key was already absent. Any other failure stops the release.
          git config --local --unset-all http.https://github.com/.extraheader || [ $? -eq 5 ]
          ! git config --local --get-all http.https://github.com/.extraheader

      # Runs after the lock step, so the manifest comes from the commit that step may have just pushed.
      - name: Generate permission manifest
        run: mise run --skip-tools manifest

      - name: Fail if the release tag points at a different commit
        # --target only applies when the tag doesn't exist, so a pre-existing tag on another commit would publish the wrong code.
        env:
          MODULE_VERSION: ${{ inputs.module_version }}
        run: |
          # An annotated tag lists the tag object first and the commit it points to on the ^{} line.
          tag_lines=$(git ls-remote --tags origin "refs/tags/${MODULE_VERSION}" "refs/tags/${MODULE_VERSION}^{}")
          tag_commit=$(echo "$tag_lines" | awk '/\^\{\}$/ { print $1 }')
          if [ -z "$tag_commit" ]; then
            tag_commit=$(echo "$tag_lines" | awk 'NR == 1 { print $1 }')
          fi
          head_commit=$(git rev-parse HEAD)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$head_commit" ]; then
            echo "The tag ${MODULE_VERSION} already points to ${tag_commit}, not ${head_commit}." >&2
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          if [ "${{ inputs.services_version }}" != "" ]; then
            cat > release_notes.md << EOF

          ## Braintrust Services
          * Updated Braintrust service image versions to \`${{ inputs.services_version }}\`
          EOF
            gh release create ${{ inputs.module_version }} \
              permission-manifest.json permission-manifest-versions.json \
              --draft \
              --target "$(git rev-parse HEAD)" \
              --generate-notes \
              --notes-file release_notes.md \
              --title "${{ inputs.module_version }}"
          else
            gh release create ${{ inputs.module_version }} \
              permission-manifest.json permission-manifest-versions.json \
              --draft \
              --target "$(git rev-parse HEAD)" \
              --generate-notes \
              --title "${{ inputs.module_version }}"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
