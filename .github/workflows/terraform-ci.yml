name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, validate, validate-tofu, check-scripts]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Run setup task
        run: mise run setup

      - name: Run ${{ matrix.task }} task
        run: mise run ${{ matrix.task }}

  test:
    name: test (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Run tests with Terraform
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          terraform init -backend=false -upgrade
          terraform test $(ls tests/*.tftest.hcl | awk -v shard="$SHARD" 'NR % 8 == shard % 8 { print "-filter=" $0 }')

  # Single required status check for branch protection.
  terraform:
    name: Terraform Lint & Validate
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          [ "${{ needs.check.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
