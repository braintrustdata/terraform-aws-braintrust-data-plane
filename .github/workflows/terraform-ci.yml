name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The upgrade test archives the pull request's base commit.
          fetch-depth: 0

      - name: Setup Mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          # Pinned so a new mise release can't change the toolchain unnoticed.
          # Keep it the same in create-release.yml.
          version: 2026.11.10

      - name: Run setup task
        run: mise run setup

      - name: Run lint task
        run: mise run lint

      - name: Validate module and example code with Terraform
        run: mise run validate

      - name: Validate module and example code with OpenTofu
        run: mise run validate-tofu

      - name: Run tests with Terraform
        env:
          # A pull request compares against its base commit, a push to main
          # against the commit it replaced.
          UPGRADE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: mise run test

      # This step is also the AC-2 Sid check, so a failure fails CI.
      - name: Generate permission manifest
        run: mise run manifest

      - name: Upload permission manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: permission-manifest
          path: |
            permission-manifest.json
            permission-manifest-versions.json
          if-no-files-found: error
          overwrite: true
