[tools]
tflint = "latest"
pre-commit = "latest"
terraform = "1.10"
opentofu = "1.10"
uv = "latest"

[tasks]
lint = ["terraform fmt -recursive", "tflint --recursive"]
setup = ["pre-commit install", "tflint --init"]
precommit = ["pre-commit run --all-files"]

[tasks.validate]
description = "Validate the Terraform module and example code"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label}"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    terraform init -upgrade
    terraform validate
  )
}

echo "Validating module"
terraform init -upgrade
terraform validate

validate_example "examples/braintrust-data-plane" "production example"
# External-EKS leaves brainstore_license_key unset (null default). `validate`
# catches syntax/type/reference mistakes on that wiring; it does NOT evaluate
# locals, so it cannot catch coalesce-on-null style bugs. Plan-mode coverage
# for that is tracked in the follow-up terraform test PR.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""

[tasks.validate-tofu]
description = "Validate the Terraform module and example code using OpenTofu"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label} with OpenTofu"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    tofu init -upgrade
    tofu validate
  )
}

echo "Validating module with OpenTofu"
tofu init -upgrade
tofu validate

validate_example "examples/braintrust-data-plane" "production example"
# External-EKS leaves brainstore_license_key unset (null default). `validate`
# catches syntax/type/reference mistakes on that wiring; it does NOT evaluate
# locals, so it cannot catch coalesce-on-null style bugs. Plan-mode coverage
# for that is tracked in the follow-up terraform test PR.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""
