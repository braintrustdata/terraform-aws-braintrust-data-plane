[tools]
tflint = "latest"
pre-commit = "latest"
terraform = "1.17"
opentofu = "1.13"
uv = "latest"

[tasks]
# The upgrade fixture directory is dot-prefixed, so fmt and tflint skip it.
lint = ["terraform fmt -recursive", "tflint --recursive", "uv run scripts/check-versions-tofu"]
setup = ["pre-commit install", "tflint --init"]
precommit = ["pre-commit run --all-files"]

[tasks.test]
description = "Run mocked Terraform plan smoke tests (no AWS credentials required)"
run = """
#!/usr/bin/env bash
set -e
# The upgrade test applies the parent from a local copy, so write it before init.
# Set UPGRADE_BASE_REF to compare against another ref, for example latest-v7.
uv run scripts/prepare-upgrade-fixture
terraform init -backend=false -upgrade
uv run scripts/check-loop-network-dependencies
uv run scripts/check-brainstore-autoscaling
uv run scripts/check-iam-ownership-tags
uv run scripts/check-iam-ownership-tags --self-test
uv run scripts/check-iam-dependencies
uv run scripts/check-external-mode-plan --self-test
terraform test
# Reads the plan JSON that the external mode test emits. Assertions can't list a plan's resources.
uv run scripts/check-external-mode-plan
uv run scripts/check-upgrade-plan
# Proves the check above rejects a workload on the wrong role or a policy on the wrong bucket in every run that wiring applies to.
uv run scripts/check-upgrade-plan --self-test
"""

[tasks.validate]
description = "Validate the Terraform module and example code"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label}"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    terraform init -upgrade
    terraform validate
  )
}

echo "Validating module"
# terraform init loads tests/, and the upgrade test points at the parent fixture,
# so write it first. Without it a fresh checkout fails with "Unreadable module directory".
uv run scripts/prepare-upgrade-fixture
terraform init -upgrade
terraform validate

validate_example "examples/braintrust-data-plane" "production example"
validate_example "examples/braintrust-data-plane-sandbox" "sandbox example"
validate_example "examples/braintrust-data-plane-private" "private example"
validate_example "examples/braintrust-data-plane-external-iam" "external IAM example"
# The external-EKS example needs no license. Tests cover this path at plan time.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""

[tasks.validate-tofu]
description = "Validate the Terraform module and example code using OpenTofu"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label} with OpenTofu"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    tofu init -upgrade -test-directory=nope
    tofu validate -no-tests
  )
}

echo "Validating module with OpenTofu"
tofu init -upgrade -test-directory=nope
tofu validate -no-tests

validate_example "examples/braintrust-data-plane" "production example"
validate_example "examples/braintrust-data-plane-sandbox" "sandbox example"
validate_example "examples/braintrust-data-plane-private" "private example"
validate_example "examples/braintrust-data-plane-external-iam" "external IAM example"
# The external-EKS example needs no license. Tests cover this path at plan time.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""
