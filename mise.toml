[tools]
tflint = "latest"
pre-commit = "latest"
terraform = "1.10"
opentofu = "1.10"
uv = "latest"

[tasks]
lint = ["terraform fmt -recursive", "tflint --recursive"]
setup = ["pre-commit install", "tflint --init"]
precommit = ["pre-commit run --all-files"]

[tasks.test]
description = "Run static script checks and mocked Terraform plan smoke tests (no AWS credentials required)"
run = ["mise run check-scripts", "mise run test-terraform"]

[tasks.check-scripts]
description = "Run static checks in scripts/ against the module source"
run = """
#!/usr/bin/env bash
set -e
terraform init -backend=false -upgrade
uv run scripts/check-loop-network-dependencies
uv run scripts/check-brainstore-autoscaling
uv run scripts/check-iam-ownership-tags
uv run scripts/check-iam-ownership-tags --self-test
"""

[tasks.test-terraform]
description = "Run mocked Terraform plan smoke tests. Set TEST_SHARD_INDEX (1-based) and TEST_SHARD_COUNT to run one shard."
run = """
#!/usr/bin/env bash
set -euo pipefail
shard_index="${TEST_SHARD_INDEX:-1}"
shard_count="${TEST_SHARD_COUNT:-1}"

# Balance shards by run block count, largest test files first.
mapfile -t test_files < <(
  for f in tests/*.tftest.hcl; do
    echo "$(grep -c '^run ' "$f") $f"
  done | sort -k1,1nr -k2,2 | awk -v n="${shard_count}" -v i="${shard_index}" '
    {
      m = 0
      for (s = 1; s < n; s++) if (load[s] < load[m]) m = s
      load[m] += $1
      if (m == i - 1) print $2
    }'
)

if [ -z "${test_files[*]:-}" ]; then
  echo "No test files in shard ${shard_index}/${shard_count}"
  exit 0
fi

echo "Shard ${shard_index}/${shard_count}: ${test_files[*]}"
terraform init -backend=false -upgrade
terraform test "${test_files[@]/#/-filter=}"
"""

[tasks.validate]
description = "Validate the Terraform module and example code"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label}"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    terraform init -upgrade
    terraform validate
  )
}

echo "Validating module"
terraform init -upgrade
terraform validate

validate_example "examples/braintrust-data-plane" "production example"
validate_example "examples/braintrust-data-plane-sandbox" "sandbox example"
validate_example "examples/braintrust-data-plane-private" "private example"
# The external-EKS example needs no license. Tests cover this path at plan time.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""

[tasks.validate-tofu]
description = "Validate the Terraform module and example code using OpenTofu"
run = """
#!/usr/bin/env bash
set -euo pipefail

validate_example() {
  local example_dir="$1"
  local label="$2"
  echo "Validating ${label} with OpenTofu"
  (
    cd "${example_dir}"
    # Override the module source to point to the local module.
    # '*_override.tf' is a lesser known native terraform feature
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF > main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    tofu init -upgrade -test-directory=nope
    tofu validate -no-tests
  )
}

echo "Validating module with OpenTofu"
tofu init -upgrade -test-directory=nope
tofu validate -no-tests

validate_example "examples/braintrust-data-plane" "production example"
validate_example "examples/braintrust-data-plane-sandbox" "sandbox example"
validate_example "examples/braintrust-data-plane-private" "private example"
# The external-EKS example needs no license. Tests cover this path at plan time.
validate_example "examples/braintrust-data-plane-external-eks-quarantine" "external-EKS example (license key unset)"
"""
