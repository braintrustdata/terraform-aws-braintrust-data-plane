apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sandbox-tls
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
{{- range $purpose, $bundle := .Values.bundles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sandbox-{{ $purpose }}-tls
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: sandbox-tls
    kind: SecretStore
  target:
    name: {{ if eq $purpose "server" }}sandbox-tls{{ else }}sandbox-client-tls{{ end }}
    template:
      data:
        {{- if eq $purpose "server" }}
        cert.pem: '{{ "{{ .cert }}" }}'
        key.pem: '{{ "{{ .key }}" }}'
        ca_cert.pem: '{{ "{{ .ca_cert }}" }}'
        {{- else }}
        client.pem: '{{ "{{ .cert }}" }}'
        client.key: '{{ "{{ .key }}" }}'
        server-ca.pem: '{{ "{{ .ca_cert }}" }}'
        {{- end }}
  dataFrom:
    - extract:
        key: {{ required "bundle ARN is required" $bundle.arn | quote }}
        version: {{ printf "uuid/%s" (required "bundle version is required" $bundle.version) | quote }}
{{- end }}
